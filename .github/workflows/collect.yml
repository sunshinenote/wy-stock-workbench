name: 每日数据采集

on:
  schedule:
    # 每个交易日收盘后运行（北京时间 15:10，UTC 07:10）
    - cron: '10 7 * * 1-5'
  workflow_dispatch: {}   # 支持手动触发
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install -q akshare pandas
          python -c "import akshare" 2>/dev/null || true

      - name: 运行采集脚本
        run: python collect.py

      - name: 提交数据变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet || git commit -m "chore: 每日行情数据更新 $(date +'%Y-%m-%d')"
          git push
