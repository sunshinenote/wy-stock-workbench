name: 每日数据采集

on:
  schedule:
    # 每个交易日盘后采集两次：
    #  - 15:30（北京时间）出大部分数据，便于尽早复盘
    #  - 18:00（北京时间）补全龙虎榜/资金（盘后数据通常 17:00 后才完整披露）
    # 重要：GitHub Actions 的定时任务不保证准时，常有数分钟~数小时延迟，属平台特性；
    #       两次采集互为兜底，确保当日数据最终一定落地。若长时间看不到更新，
    #       可到仓库 Actions 页确认是否被调度延迟，或手动 workflow_dispatch 触发。
    - cron: '30 7 * * 1-5'      # 北京时间 15:30 (UTC 07:30)
    - cron: '0 10 * * 1-5'      # 北京时间 18:00 (UTC 10:00)
  workflow_dispatch: {}   # 支持手动触发
  push:
    branches: [ main ]

# 同一时刻只允许一个采集在跑；新触发排队而非取消，保证兜底一定能跑完
concurrency:
  group: collect-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install -q akshare pandas
          python -c "import akshare" 2>/dev/null || true

      - name: 运行采集脚本
        run: python collect.py

      - name: 提交数据变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          # last_update.json 的时间戳每天不同，通常必有变更；无变更则不提交
          git diff --cached --quiet || git commit -m "chore: 每日行情数据更新 $(date +'%Y-%m-%d')"
          git push
